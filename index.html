<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Descubra receitas compatíveis com os ingredientes disponíveis na sua cozinha."
    >
    <title>ChefMatch | O que dá para cozinhar hoje?</title>
  </head>
  <body>
    <header>
      <p>ChefMatch</p>
      <h1>O que dá para cozinhar hoje?</h1>
      <p>
        Informe os ingredientes que você tem em casa e descubra receitas
        compatíveis.
      </p>
    </header>

    <main>
      <section aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Ingredientes disponíveis</h2>
        <p>O formulário será disponibilizado nesta seção.</p>
      </section>

      <section aria-labelledby="titulo-resultados">
        <h2 id="titulo-resultados">Receitas recomendadas</h2>
        <p>As recomendações serão exibidas nesta seção.</p>
      </section>
    </main>

    <footer>
      <p>Projeto acadêmico ChefMatch.</p>
    </footer>
  </body>
</html>
